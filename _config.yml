title: 糖妈日记
tagline: 从怀孕到育儿的健康饮食科普
description: >-
  从怀孕到育儿，一起养成受益一生的健康饮食习惯。
  孕期营养、妊娠糖尿病饮食、产后恢复、宝宝辅食与幼儿餐桌，
  由一位亲历妊娠糖尿病的妈妈整理的实用科普。

# 站点地址（部署在 GitHub Pages 时不要改）
url: "https://kkailab.github.io"
baseurl: "/tangma-diary"

# 作者信息（打造个人IP，改成你自己的）
author:
  name: 糖妈
  bio: 亲历妊娠糖尿病的二胎妈妈，专注孕产育儿健康饮食科普
  email: ""          # 可留空
  wechat: ""         # 公众号名称，可留空
  xiaohongshu: ""    # 小红书号，可留空

# 文章分类（首页分类卡片和导航会用到）
nav_categories:
  - name: 备孕
    slug: beiyun
    emoji: "🌱"
    desc: 备孕期的营养准备
  - name: 孕期
    slug: yunqi
    emoji: "🤰"
    desc: 孕期营养与控糖饮食
  - name: 产后
    slug: chanhou
    emoji: "🌸"
    desc: 产后恢复与哺乳期饮食
  - name: 辅食
    slug: fushi
    emoji: "🥣"
    desc: 0-1岁辅食添加
  - name: 宝宝餐桌
    slug: baobao
    emoji: "🍽️"
    desc: 1岁+幼儿饮食习惯

# ---------- 以下为技术配置，一般不用改 ----------

lang: zh-CN
timezone: Asia/Tokyo

permalink: /posts/:title/

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts/
  - docs/
  - vendor/
  - .jekyll-cache/
