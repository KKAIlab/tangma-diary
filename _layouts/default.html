<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-name">{{ site.title }}</span>
        <span class="brand-tagline">{{ site.tagline }}</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">首页</a>
        {% for cat in site.nav_categories %}
        <a href="{{ '/categories/' | append: cat.slug | append: '/' | relative_url }}">{{ cat.name }}</a>
        {% endfor %}
        <a href="{{ '/about/' | relative_url }}">关于我</a>
        <a href="{{ '/app/' | relative_url }}" class="nav-tool">控糖工具</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p class="footer-disclaimer">⚠️ 本站内容为健康科普，仅供参考，不能替代医生、注册营养师的专业建议。如有疾病或特殊情况，请及时就医。</p>
      <p>© {{ site.time | date: "%Y" }} {{ site.title }} · {{ site.tagline }} ·
        <a href="{{ '/feed.xml' | relative_url }}">RSS 订阅</a> ·
        <a href="https://github.com/KKAIlab/tangma-diary">GitHub</a>
      </p>
    </div>
  </footer>
</body>
</html>
